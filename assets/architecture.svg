<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="How Outlook 369 connects WordPress to Microsoft 365">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C5CE7"/><stop offset="1" stop-color="#5E8FF5"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f6cbd"/><stop offset="1" stop-color="#2899f5"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6C5CE7"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f6cbd"/></marker>
  </defs>
  <rect width="1200" height="520" rx="26" fill="#f7f6ff"/>
  <text x="40" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#302A44">How it fits together</text>
  <text x="40" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#6b6680">Mail is read live from Microsoft and never copied into WordPress. Only encrypted sign-in tokens are stored.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(40 140)">
      <rect width="210" height="300" rx="20" fill="#ffffff" stroke="#e2dfdc" stroke-width="2"/>
      <rect x="20" y="22" width="170" height="110" rx="12" fill="#eef2ff"/>
      <rect x="34" y="38" width="142" height="12" rx="6" fill="#c7d2fe"/>
      <rect x="34" y="60" width="100" height="10" rx="5" fill="#dfe4ff"/>
      <rect x="34" y="80" width="120" height="10" rx="5" fill="#dfe4ff"/>
      <rect x="34" y="100" width="80" height="10" rx="5" fill="#dfe4ff"/>
      <text x="105" y="178" text-anchor="middle" font-size="20" font-weight="800" fill="#302A44">Site user</text>
      <text x="105" y="206" text-anchor="middle" font-size="14" fill="#6b6680">Opens the page with</text>
      <text x="105" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#6C5CE7">[outlook369]</text>
      <text x="105" y="256" text-anchor="middle" font-size="14" fill="#6b6680">or asks Maylo AI</text>
      <text x="105" y="276" text-anchor="middle" font-size="14" fill="#6b6680">in the chat</text>
    </g>

    <g transform="translate(320 120)">
      <rect width="300" height="340" rx="22" fill="url(#g1)"/>
      <text x="150" y="44" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">Your WordPress site</text>
      <rect x="22" y="66" width="256" height="112" rx="14" fill="#ffffff" fill-opacity="0.95"/>
      <text x="150" y="98" text-anchor="middle" font-size="18" font-weight="800" fill="#302A44">Outlook 369</text>
      <text x="150" y="124" text-anchor="middle" font-size="13.5" fill="#5b5470">Mail app · OAuth sign-in</text>
      <text x="150" y="144" text-anchor="middle" font-size="13.5" fill="#5b5470">Encrypted tokens per user</text>
      <text x="150" y="164" text-anchor="middle" font-size="13.5" fill="#5b5470">AI auto-reply worker</text>
      <rect x="22" y="196" width="256" height="112" rx="14" fill="#ffffff" fill-opacity="0.95"/>
      <text x="150" y="228" text-anchor="middle" font-size="18" font-weight="800" fill="#302A44">Maylo AI</text>
      <text x="150" y="254" text-anchor="middle" font-size="13.5" fill="#5b5470">Writes replies with your prompt</text>
      <text x="150" y="274" text-anchor="middle" font-size="13.5" fill="#5b5470">Email tools in chat &amp; voice</text>
      <text x="150" y="294" text-anchor="middle" font-size="13.5" fill="#5b5470">Wallet billing</text>
      <path d="M150 178 L150 196" stroke="#6C5CE7" stroke-width="3"/>
    </g>

    <g transform="translate(700 120)">
      <rect width="210" height="150" rx="20" fill="#ffffff" stroke="#cfe0f7" stroke-width="2"/>
      <circle cx="105" cy="46" r="24" fill="url(#g2)"/>
      <path d="M93 46 L102 55 L118 38" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="96" text-anchor="middle" font-size="17" font-weight="800" fill="#0f3a6b">Microsoft identity</text>
      <text x="105" y="118" text-anchor="middle" font-size="13" fill="#4a6385">login.microsoftonline.com</text>
      <text x="105" y="136" text-anchor="middle" font-size="13" fill="#4a6385">Sign-in &amp; consent</text>
    </g>

    <g transform="translate(700 310)">
      <rect width="210" height="150" rx="20" fill="#ffffff" stroke="#cfe0f7" stroke-width="2"/>
      <rect x="80" y="22" width="50" height="50" rx="10" fill="url(#g2)"/>
      <text x="105" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">G</text>
      <text x="105" y="100" text-anchor="middle" font-size="17" font-weight="800" fill="#0f3a6b">Microsoft Graph</text>
      <text x="105" y="122" text-anchor="middle" font-size="13" fill="#4a6385">graph.microsoft.com/v1.0</text>
      <text x="105" y="140" text-anchor="middle" font-size="13" fill="#4a6385">/me/messages · /sendMail</text>
    </g>

    <g transform="translate(970 230)">
      <rect width="190" height="170" rx="20" fill="#0f6cbd"/>
      <rect x="40" y="26" width="110" height="70" rx="10" fill="#ffffff"/>
      <path d="M46 32 L95 70 L144 32" fill="none" stroke="#0f6cbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="128" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Outlook mailbox</text>
      <text x="95" y="150" text-anchor="middle" font-size="12.5" fill="#d7e8fb">Exchange Online</text>
    </g>
  </g>

  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M252 290 L314 290" stroke="#6C5CE7" marker-end="url(#arr)"/>
    <path d="M622 200 L694 200" stroke="#0f6cbd" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
    <path d="M622 380 L694 380" stroke="#0f6cbd" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
    <path d="M912 385 C950 385 950 330 964 322" stroke="#0f6cbd" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#5b5470">
    <text x="658" y="186" text-anchor="middle">tokens</text>
    <text x="658" y="366" text-anchor="middle">mail API</text>
  </g>
</svg>
