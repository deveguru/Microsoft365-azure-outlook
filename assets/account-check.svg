<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Which Microsoft accounts have a mailbox">
  <rect width="1200" height="330" rx="26" fill="#ffffff" stroke="#e2dfdc" stroke-width="2"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="56" font-size="26" font-weight="800" fill="#302A44">Which account should I sign in with?</text>
    <text x="40" y="86" font-size="16" fill="#6b6680">Signing in works with any Microsoft account — but only accounts with an Outlook mailbox can load email.</text>

    <g transform="translate(40 116)">
      <rect width="355" height="180" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <circle cx="44" cy="44" r="22" fill="#10b981"/><path d="M33 44 l8 8 l14 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="52" font-size="19" font-weight="800" fill="#065f46">Works</text>
      <text x="26" y="96" font-size="15" fill="#065f46">• name@outlook.com / hotmail.com / live.com</text>
      <text x="26" y="122" font-size="15" fill="#065f46">• Microsoft 365 work or school account</text>
      <text x="26" y="144" font-size="15" fill="#065f46">  with an Exchange Online license</text>
    </g>
    <g transform="translate(422 116)">
      <rect width="355" height="180" rx="20" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <circle cx="44" cy="44" r="22" fill="#ef4444"/><path d="M36 36 l16 16 M52 36 l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="80" y="52" font-size="19" font-weight="800" fill="#991b1b">No mailbox</text>
      <text x="26" y="96" font-size="15" fill="#991b1b">• Guest accounts: name_gmail.com#EXT#@…</text>
      <text x="26" y="122" font-size="15" fill="#991b1b">• Microsoft account made with a Gmail</text>
      <text x="26" y="144" font-size="15" fill="#991b1b">  or other non-Outlook address</text>
    </g>
    <g transform="translate(804 116)">
      <rect width="356" height="180" rx="20" fill="#eef2ff" stroke="#6C5CE7" stroke-width="2"/>
      <circle cx="44" cy="44" r="22" fill="#6C5CE7"/><text x="44" y="52" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">i</text>
      <text x="80" y="52" font-size="19" font-weight="800" fill="#302A44">Tell-tale errors</text>
      <text x="26" y="96" font-size="14.5" fill="#4c3fb8" font-weight="700">OrganizationFromTenantGuidNotFound</text>
      <text x="26" y="120" font-size="14.5" fill="#4c3fb8" font-weight="700">MailboxNotEnabledForRESTAPI</text>
      <text x="26" y="150" font-size="14" fill="#5b5470">See them in Settings → Outlook 369</text>
      <text x="26" y="170" font-size="14" fill="#5b5470">→ Connection diagnostics.</text>
    </g>
  </g>
</svg>
